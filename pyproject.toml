[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schizo-eeg"
version = "0.1.0"
description = "Subject-level schizophrenia classification from resting-state EEG."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "scikit-learn>=1.1",
    "mne>=1.6",
    "joblib>=1.1",
    "pyyaml>=6.0",
    "python-dotenv>=0.21",
]

[project.optional-dependencies]
deep = ["tensorflow>=2.10"]
dev = ["pytest>=7"]

[project.scripts]
schizo-eeg = "schizo_eeg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
